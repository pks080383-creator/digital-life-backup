name: Advanced Excel Automation CI

on:
  push:
    branches:
      - build/advanced-excel-service-v1
    paths:
      - "projects/advanced-excel-service/**"
      - ".github/workflows/advanced-excel-ci.yml"
  pull_request:
    paths:
      - "projects/advanced-excel-service/**"
      - ".github/workflows/advanced-excel-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for n8n Code-node syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install workbook QA dependency
        run: python -m pip install -r projects/advanced-excel-service/requirements.txt

      - name: Run workbook QA tests
        run: python -m unittest discover -s projects/advanced-excel-service/tests -v

      - name: Validate n8n workflow JSON and Code nodes
        run: python projects/advanced-excel-service/scripts/validate_n8n_workflows.py
